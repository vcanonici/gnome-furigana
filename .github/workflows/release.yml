name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  settings-fork:
    # GNOME Settings 46.7 with the Furigana panel, built against Ubuntu 24.04 libraries.
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build gnome-control-center fork
        run: settings-panel/build-fork.sh "$PWD/build/settings"
      - uses: actions/upload-artifact@v4
        with:
          name: settings-fork
          path: build/settings
  release:
    needs: settings-fork
    runs-on: ubuntu-24.04
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libglib2.0-bin shellcheck zip
      - run: npm ci
      - run: node ci/cli.mjs run --full
      - uses: actions/download-artifact@v4
        with:
          name: settings-fork
          path: build/settings
      - name: Stage release
        run: chmod +x build/settings/bin/* && SETTINGS_FORK_DIR="$PWD/build/settings" packaging/stage-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "gnome-furigana $version" --notes-file CHANGELOG.md --prerelease \
            dist/gnome-furigana-*-x86_64.tar.gz dist/gnome-furigana-*-x86_64.tar.gz.sha256
