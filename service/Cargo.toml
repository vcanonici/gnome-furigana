[package]
name = "gnome-furigana"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Serviço linguístico do gnome-furigana: furigana e significados pt-BR via D-Bus"
license = "GPL-2.0-or-later"
repository = "https://github.com/vcanonici/gnome-furigana"
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
# UniDic (NINJAL) embedded: best readings for UI text, no runtime data files; mapped lazily.
lindera = { version = "7.0.0", default-features = false, features = ["embed-unidic"] }
lru = "0.19.2"
quick-xml = "0.42.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
zbus = { version = "6.5.0", default-features = false, features = ["default-rt", "service"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
